<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Live Code</title>
<style>
  :root { --bg:#f5f6f8; --panel:#fff; --line:#d9dce1; --text:#1d2330; --muted:#6b7280; --accent:#1f7a4d; --stop:#b42318; --err:#c0262d; --sel:#2563eb; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font-family:system-ui,"Noto Sans Thai","Leelawadee UI",sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:10px; padding:6px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; white-space:nowrap; }
  #status { font-size:13px; padding:3px 10px; border-radius:99px; background:#e5e7eb; color:var(--muted); white-space:nowrap; }
  #status.run { background:#dcfce7; color:var(--accent); }
  #status.off { background:#fee2e2; color:var(--err); }
  #info { font-size:12px; color:var(--muted); }
  .sp { flex:1; }
  button, select { font:inherit; font-size:14px; padding:6px 14px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
  #run { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }
  #stop { background:var(--stop); color:#fff; border-color:var(--stop); font-weight:600; }
  main { flex:1; display:flex; min-height:0; }
  #left { flex:1.6; display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line); }
  .tabs { display:flex; background:var(--panel); border-bottom:1px solid var(--line); }
  .tabs button { border:0; border-radius:0; border-bottom:3px solid transparent; background:none; padding:8px 18px; color:var(--muted); }
  .tabs button.on { color:var(--text); border-bottom-color:var(--sel); font-weight:600; }
  .pane { flex:1; min-height:0; position:relative; }
  #blocks { position:absolute; inset:0; }
  #codePane { display:none; flex-direction:column; }
  #manualBar { display:none; align-items:center; gap:8px; padding:6px 10px; background:#fef9c3; font-size:13px; border-bottom:1px solid var(--line); }
  #manualBar button { font-size:12px; padding:2px 10px; }
  .editor { flex:1; display:flex; min-height:0; background:#fff; }
  #gutter { padding:10px 6px 10px 10px; text-align:right; color:#9ca3af; background:#f9fafb; border-right:1px solid var(--line); font:14px/1.5 Consolas,"Courier New",monospace; overflow:hidden; user-select:none; white-space:pre; }
  #code { flex:1; resize:none; border:0; padding:10px; font:14px/1.5 Consolas,"Courier New",monospace; outline:none; tab-size:2; white-space:pre; overflow:auto; }
  #right { flex:1; display:flex; flex-direction:column; min-width:0; }
  #vals { display:grid; grid-template-columns:repeat(auto-fill,minmax(140px,1fr)); gap:8px; padding:8px; border-bottom:1px solid var(--line); max-height:45%; overflow:auto; }
  #vals:empty { display:none; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; min-width:0; }
  .card .k { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .v { font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card svg { display:block; width:100%; height:30px; }
  .card polyline { fill:none; stroke:var(--sel); stroke-width:1.5; vector-effect:non-scaling-stroke; }
  .bar { display:flex; align-items:center; padding:4px 8px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line); background:var(--panel); }
  .bar button { font-size:12px; padding:2px 10px; }
  #console { flex:1; overflow:auto; margin:0; padding:8px 12px; background:#111827; color:#e5e7eb; font:13px/1.45 Consolas,monospace; white-space:pre-wrap; word-break:break-word; }
  #console .t1 { color:#fca5a5; }
  #console .t2 { color:#9ca3af; }
  #console .orig { color:#9ca3af; font-size:11px; padding-left:1.2em; }
  #console .jump { cursor:pointer; }
  #console .jump:hover { background:rgba(255,255,255,.06); }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  #fname { font-size:13px; color:var(--muted); max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #fname.dirty::after { content:' •'; color:#d97706; }
  #auto { display:none; font-size:12px; padding:2px 8px; border-radius:99px; background:#fef3c7; color:#92400e; white-space:nowrap; }
  .menuwrap { position:relative; }
  #menu { display:none; position:absolute; right:0; top:calc(100% + 4px); z-index:50; background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,.15); padding:4px; min-width:220px; }
  #menu.open { display:block; }
  #menu button { display:block; width:100%; text-align:left; border:0; background:none; padding:8px 12px; border-radius:6px; }
  #menu button:hover { background:#f3f4f6; }
  #menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  dialog { border:0; border-radius:10px; padding:0; width:min(440px, calc(100vw - 32px)); box-shadow:0 20px 50px rgba(0,0,0,.3); color:var(--text); }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  .dh { padding:14px 18px 6px; font-weight:600; font-size:16px; }
  .db { padding:6px 18px 12px; font-size:14px; max-height:60vh; overflow:auto; }
  .db p { margin:6px 0; }
  .db input[type=text], .db input[type=password] { width:100%; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin:4px 0 8px; }
  .db label { font-size:13px; color:var(--muted); }
  .db > button { margin:2px 0 10px; }
  .df { display:flex; gap:8px; justify-content:flex-end; padding:10px 18px 14px; flex-wrap:wrap; }
  .primary { background:var(--sel); color:#fff; border-color:var(--sel); }
  .danger { background:var(--stop); color:#fff; border-color:var(--stop); }
  .row { display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid #f0f1f3; }
  .row .n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row button { font-size:12px; padding:3px 10px; }
  .row.pick { cursor:pointer; border-radius:6px; }
  .row.pick:hover { background:#f3f4f6; }
  .muted { color:var(--muted); font-size:12px; }
  .err { color:var(--err); font-size:13px; min-height:1em; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#111827; color:#fff; padding:8px 16px; border-radius:8px; font-size:14px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:100; max-width:calc(100vw - 32px); }
  #toast.show { opacity:1; }
  @media (max-width:800px) {
    body { overflow:auto; }
    main { flex-direction:column; flex:none; }
    #left { border-right:0; border-bottom:1px solid var(--line); height:62vh; }
    #right { height:50vh; }
    #info, header .sp, #fname { display:none; }
    header { gap:6px; padding:6px 8px; }
    header h1 { display:none; }
    #examples { flex:1; min-width:0; padding:6px 4px; }
    header button { padding:6px 10px; }
    #menuBtn .lbl { display:none; }
    #menu { position:fixed; left:auto; right:8px; max-width:calc(100vw - 16px); }
  }
  /* ================= theme v2: look and feel ================= */
  :root { --bg:#edf1f7; --panel:#fff; --line:#dbe2ec; --text:#172033; --muted:#64748b; --accent:#16a34a; --stop:#dc2626; --sel:#2563eb; --r:12px;
          --sh:0 1px 2px rgba(15,23,42,.06), 0 6px 18px rgba(15,23,42,.07); }
  body { font-size:15px; background:var(--bg); }
  .sub { font-size:11.5px; color:#bcd0f0; margin-top:1px; white-space:nowrap; }
  header { padding:8px 16px; gap:12px; background:linear-gradient(100deg,#0b1224 0%,#16306b 55%,#0e7490 100%); border:0; color:#fff;
           box-shadow:0 2px 12px rgba(15,23,42,.35); position:relative; z-index:20; }
  .brand { display:flex; align-items:center; gap:10px; min-width:0; }
  .logo { width:40px; height:40px; padding:6px; border-radius:12px; background:linear-gradient(135deg,#38bdf8,#2563eb); box-shadow:0 2px 8px rgba(0,0,0,.35); flex:none; }
  header h1 { font-size:17px; letter-spacing:.2px; margin:0; }
  #fname { color:#cbd5e1; } #info { color:#9fb3d6; }
  #status { background:rgba(255,255,255,.14); color:#e2e8f0; display:inline-flex; align-items:center; gap:7px; padding:4px 12px; }
  #status::before { content:''; width:8px; height:8px; border-radius:50%; background:#94a3b8; }
  #status.run { background:rgba(34,197,94,.2); color:#bbf7d0; }
  #status.run::before { background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.3); animation:lcpulse 1.2s infinite; }
  #status.off { background:rgba(239,68,68,.22); color:#fecaca; } #status.off::before { background:#ef4444; }
  @keyframes lcpulse { 50% { box-shadow:0 0 0 7px rgba(34,197,94,0); } }
  #auto { background:rgba(250,204,21,.2); color:#fde68a; }
  header button { border-radius:10px; border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff; transition:background .15s, transform .05s; }
  header button:hover { background:rgba(255,255,255,.2); }
  header button:active { transform:translateY(1px); }
  #run { background:linear-gradient(#22c55e,#16a34a); border-color:#15803d; font-weight:700; padding:7px 22px; box-shadow:0 2px 8px rgba(22,163,74,.5); }
  #run:hover { background:linear-gradient(#34d399,#16a34a); }
  #stop { background:linear-gradient(#ef4444,#dc2626); border-color:#b91c1c; font-weight:700; }
  #stop:hover { background:linear-gradient(#f87171,#dc2626); }
  #menu { color:var(--text); border-radius:12px; box-shadow:0 12px 32px rgba(15,23,42,.25); }
  #menu button { color:var(--text); border-radius:8px; }

  .tabs { background:var(--panel); border-bottom:1px solid var(--line); padding:6px 10px 0; gap:4px; align-items:flex-end; }
  .tabs > button { border:0; border-radius:10px 10px 0 0; padding:9px 16px; background:transparent; color:var(--muted); font-weight:600; }
  .tabs > button:hover { background:#f3f6fb; }
  .tabs > button.on { color:var(--sel); background:#eef3ff; border-bottom:0; box-shadow:inset 0 -3px 0 var(--sel); }
  .tools { display:flex; gap:6px; padding-bottom:5px; flex-wrap:wrap; justify-content:flex-end; }
  .tools button { padding:5px 10px; font-size:13px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  .tools button:hover { background:#eef3ff; border-color:#bfd0f6; }
  .mini { font-size:12.5px; padding:4px 11px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); }
  .mini:hover { background:#eef3ff; border-color:#bfd0f6; }
  .badge { display:inline-block; min-width:18px; padding:0 6px; margin-left:4px; border-radius:99px; background:var(--sel); color:#fff; font-size:11.5px; line-height:18px; text-align:center; }
  .badge.warn { background:#f59e0b; } .badge.hide { display:none; }
  #left { border-right:1px solid var(--line); }
  #blocks { background:#fbfcfe; }

  #right { background:var(--bg); }
  #consoleWrap { flex:1; display:flex; flex-direction:column; min-height:0; }
  #vals { background:var(--panel); }
  .card { border-radius:10px; box-shadow:var(--sh); }
  #console { background:#0f172a; color:#e2e8f0; padding:10px 14px; font-size:13.5px; line-height:1.55; }
  #wiringPane { display:none; flex:1; overflow:auto; padding:12px 14px 20px; min-height:0; }
  #wiringPane.on { display:block; }

  /* wiring tab */
  .wcard { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; box-shadow:var(--sh); margin-bottom:10px; }
  .exnote { background:#eff6ff; border-color:#bfdbfe; font-size:13.5px; line-height:1.55; }
  .exnote b { display:block; margin-bottom:4px; }
  .wsum { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; padding:10px 14px; margin-bottom:10px; background:linear-gradient(100deg,#ecfdf5,#eff6ff); border:1px solid #bbf7d0; border-radius:var(--r); font-size:13.5px; }
  .wsum b { font-size:15px; }
  .wh { display:flex; align-items:center; justify-content:space-between; margin:14px 2px 8px; font-size:14.5px; }
  .wnote { font-size:12px; color:var(--muted); margin:4px 2px 10px; }
  .wwarn { padding:9px 12px; border-radius:10px; font-size:13.5px; line-height:1.5; margin-bottom:8px; border:1px solid; }
  .wwarn.err { background:#fef2f2; border-color:#fecaca; color:#991b1b; }
  .wwarn.warn { background:#fffbeb; border-color:#fde68a; color:#92400e; }
  .wwarn.info { background:#f8fafc; border-color:var(--line); color:#334155; }
  .diag { padding:4px; background:#fff; }
  .boardsvg { width:100%; height:auto; display:block; }
  .boardsvg .pcb { fill:#0f3d2e; stroke:#082a1f; stroke-width:2; }
  .boardsvg .mod { fill:#1f2937; stroke:#4b5563; } .boardsvg .modt { fill:#9ca3af; font-size:17px; font-weight:700; text-anchor:middle; }
  .boardsvg .ant { fill:none; stroke:#fbbf24; stroke-width:2.5; stroke-linejoin:round; }
  .boardsvg .btn { fill:#cbd5e1; stroke:#64748b; } .boardsvg .btnt { fill:#cbd5e1; font-size:10px; text-anchor:middle; }
  .boardsvg .usb { fill:#9ca3af; stroke:#6b7280; } .boardsvg .usbt { fill:#111827; font-size:11px; font-weight:700; text-anchor:middle; }
  .boardsvg .pn { fill:#fff; font-size:12px; font-weight:700; }
  .boardsvg .pl { fill:#172033; font-size:13px; font-weight:700; }
  .boardsvg .pl.clash { fill:#b91c1c; }
  .boardsvg text { font-family:inherit; }
  .bigdiag { max-width:560px; margin:0 auto; }
  .dev { background:var(--panel); border:1px solid var(--line); border-left:5px solid var(--c); border-radius:var(--r); padding:10px 12px; margin-bottom:10px; box-shadow:var(--sh); }
  .dev-h { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .dev-i { font-size:22px; } .dev-k { margin-left:auto; font-size:11.5px; color:var(--muted); background:#f1f5f9; border-radius:99px; padding:1px 9px; white-space:nowrap; }
  .wires { border-collapse:collapse; width:100%; font-size:13.5px; }
  .wires td { padding:4px 4px; vertical-align:middle; border-top:1px dashed #e8edf4; }
  .wires tr:first-child td { border-top:0; }
  .wc { width:34px; } .wsw { display:block; width:26px; height:7px; border-radius:4px; box-shadow:0 0 0 1px rgba(0,0,0,.18); }
  .wp { font-weight:600; } .wa { width:18px; color:var(--muted); text-align:center; }
  .bp { display:inline-flex; align-items:baseline; gap:6px; background:#0f3d2e; color:#fff; border-radius:7px; padding:2px 9px; font-size:13.5px; }
  .bp small { color:#a7f3d0; font-size:11px; } .bp.rail { background:#334155; }
  .via { font-size:11.5px; color:#b45309; margin-top:2px; }
  .fix { font-size:13px; background:#fffbeb; border:1px solid #fde68a; color:#92400e; border-radius:8px; padding:6px 9px; margin-top:7px; line-height:1.45; }
  .dnote { font-size:12.5px; color:#475569; margin-top:6px; line-height:1.45; }
  .wlist { margin:0 0 8px 2px; padding-left:20px; font-size:13.5px; line-height:1.7; }
  .wfoot { margin-top:14px; text-align:center; }
  .wempty { text-align:center; padding:26px 16px; color:var(--muted); }
  .wempty .wicon { font-size:38px; } .wempty b { display:block; color:var(--text); margin:6px 0 4px; font-size:16px; } .wempty p { margin:0; font-size:13.5px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; justify-content:center; margin:8px 0; }
  .lg i { display:inline-block; width:11px; height:11px; border-radius:50%; margin-right:5px; vertical-align:-1px; }
  .tips p { margin:6px 0; font-size:13.5px; line-height:1.55; }

  /* dialogs */
  dialog { border-radius:16px; }
  dialog.wide { width:min(960px, 96vw); }
  .dh { font-size:17px; padding:16px 20px 8px; }
  .db { padding:8px 20px 14px; }
  .df { padding:12px 20px 16px; }
  button.primary { background:linear-gradient(#3b82f6,#2563eb); border-color:#1d4ed8; font-weight:600; }
  button.primary:hover { background:linear-gradient(#60a5fa,#2563eb); }

  /* gallery */
  .gal-search { width:100%; font:inherit; padding:10px 14px; border:1px solid var(--line); border-radius:10px; margin:2px 0 10px; background:#f8fafc; }
  .gal-search:focus { outline:2px solid #93c5fd; background:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:5px 13px; border-radius:99px; font-size:13px; border:1px solid var(--line); background:var(--panel); }
  .chip.on { background:var(--sel); border-color:var(--sel); color:#fff; }
  .gal-count { margin:8px 2px; }
  .gal-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(215px, 1fr)); gap:12px; }
  .ex-card { text-align:left; display:flex; flex-direction:column; gap:6px; padding:12px 13px; border-radius:14px; border:1px solid var(--line); background:var(--panel); box-shadow:var(--sh); transition:transform .12s, box-shadow .12s, border-color .12s; }
  .ex-card:hover { transform:translateY(-2px); border-color:#93c5fd; box-shadow:0 8px 22px rgba(37,99,235,.18); }
  .ex-top { display:flex; align-items:center; justify-content:space-between; }
  .ex-ico { font-size:30px; line-height:1; } .ex-lv { font-size:11px; letter-spacing:1px; color:#f59e0b; }
  .ex-t { font-size:14.5px; line-height:1.35; }
  .ex-d { font-size:12.5px; color:var(--muted); line-height:1.45; flex:1; }
  .ex-parts { display:flex; flex-wrap:wrap; gap:4px; margin-top:2px; }
  .pchip { font-size:11.5px; padding:2px 8px; border-radius:99px; background:#f1f5f9; color:#334155; white-space:nowrap; }
  .pchip.ok { background:#dcfce7; color:#166534; }

  /* block search + welcome */
  .bs-list { display:flex; flex-direction:column; gap:3px; max-height:52vh; overflow:auto; }
  .bs-row { display:flex; align-items:center; gap:10px; text-align:left; border:0; background:none; padding:7px 8px; border-radius:8px; }
  .bs-row:hover, .bs-row:focus { background:#eef3ff; outline:none; }
  .bs-row i { width:12px; height:12px; border-radius:4px; flex:none; }
  .bs-t { font-weight:600; font-family:Consolas,monospace; font-size:13.5px; } .bs-row small { color:var(--muted); margin-left:auto; text-align:right; font-size:11.5px; }
  .wlead { font-size:15px; line-height:1.6; margin:2px 0 12px; }
  .wstep { display:flex; gap:12px; align-items:flex-start; padding:9px 0; }
  .wn { flex:none; width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#38bdf8,#2563eb); color:#fff; font-weight:700; display:flex; align-items:center; justify-content:center; }

  @media (max-width:800px) {
    .sub, .brand h1 { display:none; }
    .logo { width:34px; height:34px; }
    #galleryBtn .lbl { display:none; }
    .tools { width:100%; justify-content:flex-start; padding-bottom:6px; }
    .tabs { flex-wrap:wrap; }
    #left { flex:none; height:68vh; min-height:440px; }
    #right { flex:none; height:auto; min-height:55vh; }
    #console { min-height:200px; }
    .gal-grid { grid-template-columns:1fr 1fr; gap:8px; }
    .ex-d { display:none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><g stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M12 3v5M16 3v5M20 3v5M12 24v5M16 24v5M20 24v5M3 12h5M3 16h5M3 20h5M24 12h5M24 16h5M24 20h5"/></g><rect x="8" y="8" width="16" height="16" rx="3.5" fill="#fff"/><path d="M13 13.5l4 2.5-4 2.5" stroke="#2563eb" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M18.5 19h3" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div><h1>ESP32 Live Code</h1><div class="sub">ลากบล็อก แล้วกดรัน — ทำงานบนบอร์ดทันที</div></div>
  </div>
  <span id="fname" title="ชื่อโปรแกรม"></span>
  <span id="status">กำลังเชื่อมต่อ…</span>
  <span id="auto" title="บอร์ดมีโปรแกรมที่รันเองตอนเปิดเครื่อง">⚡ autorun</span>
  <span id="info"></span>
  <span class="sp"></span>
  <button id="galleryBtn" title="เลือกตัวอย่างโปรแกรม">📚<span class="lbl"> ตัวอย่างโปรแกรม</span></button>
  <button id="run" title="รัน (Ctrl+Enter)">▶ รัน</button>

<script>
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};

// ------------------------------------------------------------------ pins
const range = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => a + i);
const OUT_PINS = [2, 4, 5, ...range(12, 19), 21, 22, 23, 25, 26, 27, 32, 33];
const IN_PINS = [0, ...OUT_PINS, 34, 35, 36, 39];
const ADC_PINS = [32, 33, 34, 35, 36, 39];               // ADC1 only: ADC2 is unusable while WiFi is on
const TOUCH = [[4, 0], [0, 1], [2, 2], [15, 3], [13, 4], [12, 5], [14, 6], [27, 7], [33, 8], [32, 9]];
const PIN_HINT = { 0: ' (BOOT)', 2: ' (LED)', 12: ' ⚠', 15: ' ⚠' };      // short hints in pin drop-downs
const opts = pins => pins.map(p => ['GPIO' + p + (PIN_HINT[p] || ''), String(p)]);
const TOUCH_OPTS = TOUCH.map(([g, t]) => ['T' + t + ' (GPIO' + g + ')', String(g)]);

const C = { io: '#d97706', board: '#0891b2', time: '#7c3aed', disp: '#16a34a', ctl: '#ca8a04', math: '#5b67a5',
  i2c: '#0f766e', oled: '#475569', lcd: '#4d7c0f', act: '#be185d' };
const NOTES = [['C4 (โด)', '262'], ['D4 (เร)', '294'], ['E4 (มี)', '330'], ['F4 (ฟา)', '349'], ['G4 (ซอล)', '392'], ['A4 (ลา)', '440'],
  ['B4 (ที)', '494'], ['C5 (โด สูง)', '523'], ['D5', '587'], ['E5', '659'], ['F5', '698'], ['G5', '784'], ['A5', '880'], ['B5', '988'], ['C6', '1047'], ['พัก (เงียบ)', '0']];
const I2C_PINS = opts([21, 22, 4, 5, 13, 14, 15, 16, 17, 18, 19, 23, 25, 26, 27, 32, 33]);
const I2C_PINS_SCL = [I2C_PINS[1], I2C_PINS[0], ...I2C_PINS.slice(2)];   // GPIO22 first
const WIRE = ' — ต่อ SDA=GPIO21, SCL=GPIO22, VCC=3.3V, GND';

// ------------------------------------------------------------------ custom blocks
const ok = typeof Blockly !== 'undefined';
if (ok) {
  // Block text in code style: English wording for every built-in block, Lua words where they fit.
  // Tooltips and the rest of the UI (menus, dialogs) stay Thai.
  const EN = window.BLOCKLY_MSG_EN || {};
  for (const k in EN) {
    if (/^(CONTROLS|LOGIC|MATH|TEXT|LISTS|VARIABLES|PROCEDURES)_/.test(k) && !/TOOLTIP|HELPURL|WARNING/.test(k)) Blockly.Msg[k] = EN[k];
  }
  Object.assign(Blockly.Msg, {
    CONTROLS_IF_MSG_IF: 'if', CONTROLS_IF_MSG_THEN: 'then', CONTROLS_IF_MSG_ELSEIF: 'elseif', CONTROLS_IF_MSG_ELSE: 'else',
    CONTROLS_REPEAT_TITLE: 'repeat %1 times', CONTROLS_WHILEUNTIL_INPUT_DO: 'do',
    CONTROLS_WHILEUNTIL_OPERATOR_WHILE: 'while', CONTROLS_WHILEUNTIL_OPERATOR_UNTIL: 'until',
    CONTROLS_FOR_TITLE: 'for %1 = %2, %3, %4', CONTROLS_FOREACH_TITLE: 'for %1 in %2',
    CONTROLS_FLOW_STATEMENTS_OPERATOR_BREAK: 'break', CONTROLS_FLOW_STATEMENTS_OPERATOR_CONTINUE: 'continue',
    VARIABLES_SET: '%1 = %2',
    TEXT_PRINT_TITLE: 'print %1', TEXT_JOIN_TITLE_CREATEWITH: 'join', TEXT_LENGTH_TITLE: '#%1',
    LISTS_CREATE_WITH_INPUT_WITH: 'list', LISTS_CREATE_EMPTY_TITLE: '{ }', LISTS_LENGTH_TITLE: '#%1',
    PROCEDURES_DEFNORETURN_TITLE: 'function', PROCEDURES_DEFRETURN_TITLE: 'function', PROCEDURES_BEFORE_PARAMS: '(',
    PROCEDURES_DEFNORETURN_PROCEDURE: 'doSomething', PROCEDURES_DEFRETURN_PROCEDURE: 'calc',
    PROCEDURES_CALL_BEFORE_PARAMS: '(', PROCEDURES_DEFRETURN_RETURN: 'return',
    VARIABLES_DEFAULT_NAME: 'item', UNNAMED_KEY: 'unnamed',
  });
  Blockly.common.defineBlocksWithJsonArray([
    { type: 'io_pin_mode', message0: 'pinMode %1 %2',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(IN_PINS) },
              { type: 'field_dropdown', name: 'MODE', options: [['OUTPUT', 'OUTPUT'], ['INPUT', 'INPUT'], ['INPUT_PULLUP', 'INPUT_PULLUP'], ['INPUT_PULLDOWN', 'INPUT_PULLDOWN']] }],
      previousStatement: null, nextStatement: null, colour: C.io, tooltip: 'กำหนดโหมดของขา (GPIO34-39 เป็นรับเข้าเท่านั้น)' },
    { type: 'io_digital_write', message0: 'digitalWrite %1 %2',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(OUT_PINS) },
              { type: 'field_dropdown', name: 'STATE', options: [['HIGH', 'HIGH'], ['LOW', 'LOW']] }],
      previousStatement: null, nextStatement: null, colour: C.io, tooltip: 'สั่งขาให้เป็น HIGH (3.3V) หรือ LOW (0V)' },
    { type: 'io_digital_write_n', message0: 'digitalWrite %1 %2',
      args0: [{ type: 'input_value', name: 'PIN', check: 'Number' },
              { type: 'field_dropdown', name: 'STATE', options: [['HIGH', 'HIGH'], ['LOW', 'LOW']] }],
      inputsInline: true, previousStatement: null, nextStatement: null, colour: C.io,
      tooltip: 'เขียนขาที่เลขมาจากตัวแปร/รายการ (เช่นวนทีละขา) ตั้งเป็นขาส่งออกให้เอง' },
    { type: 'io_digital_toggle', message0: 'toggle %1',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(OUT_PINS) }],
      previousStatement: null, nextStatement: null, colour: C.io, tooltip: 'ถ้าเปิดอยู่ให้ปิด ถ้าปิดอยู่ให้เปิด' },
    { type: 'io_digital_read', message0: 'digitalRead %1',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(IN_PINS) }],
      output: 'Number', colour: C.io, tooltip: 'ได้ 1 (HIGH) หรือ 0 (LOW)' },
    { type: 'io_digital_is_high', message0: 'digitalRead %1 == HIGH',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(IN_PINS) }],
      output: 'Boolean', colour: C.io, tooltip: 'จริง ถ้าขาเป็น HIGH' },
    { type: 'io_analog_read', message0: 'analogRead %1',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(ADC_PINS) }],
      output: 'Number', colour: C.io, tooltip: 'ค่า 0-4095 (0-3.3V)' },
    { type: 'io_pwm', message0: 'analogWrite %1 %2',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(OUT_PINS) }, { type: 'input_value', name: 'VALUE', check: 'Number' }],
      inputsInline: true, previousStatement: null, nextStatement: null, colour: C.io, tooltip: 'PWM 0-255: ปรับความสว่าง/ความเร็ว 0 = ปิด, 255 = เต็มที่' },
    { type: 'io_touch_read', message0: 'touchRead %1',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: TOUCH_OPTS }],
      output: 'Number', colour: C.io, tooltip: 'ค่าจะลดลงเมื่อแตะ (ไม่แตะ ~60-110, แตะ ~10-30)' },

    { type: 'board_led', message0: 'digitalWrite LED_BUILTIN %1',
      args0: [{ type: 'field_dropdown', name: 'STATE', options: [['HIGH', 'HIGH'], ['LOW', 'LOW']] }],
      previousStatement: null, nextStatement: null, colour: C.board, tooltip: 'LED สีฟ้าบนบอร์ด (GPIO2)' },
    { type: 'board_boot', message0: 'BOOT pressed', output: 'Boolean', colour: C.board, tooltip: 'จริง เมื่อกดปุ่ม BOOT บนบอร์ด (digitalRead(0) == LOW)' },

    { type: 'time_delay_ms', message0: 'delay %1 ms', args0: [{ type: 'input_value', name: 'MS', check: 'Number' }],
      inputsInline: true, previousStatement: null, nextStatement: null, colour: C.time, tooltip: '1000 มิลลิวินาที = 1 วินาที' },
    { type: 'time_delay_s', message0: 'delay %1 s', args0: [{ type: 'input_value', name: 'S', check: 'Number' }],
      inputsInline: true, previousStatement: null, nextStatement: null, colour: C.time, tooltip: 'รอเป็นวินาที (ทศนิยมได้ เช่น 0.5)' },
    { type: 'time_millis', message0: 'millis()', output: 'Number', colour: C.time, tooltip: 'มิลลิวินาทีตั้งแต่บอร์ดเริ่มทำงาน' },

    { type: 'disp_show', message0: 'show %1 %2',
      args0: [{ type: 'field_input', name: 'NAME', text: 'value' }, { type: 'input_value', name: 'VALUE' }],
      inputsInline: true, previousStatement: null, nextStatement: null, colour: C.disp, tooltip: 'แสดงเป็นการ์ดด้านขวา ถ้าเป็นตัวเลขจะมีกราฟ' },
    { type: 'disp_clear', message0: 'clear()', previousStatement: null, nextStatement: null, colour: C.disp, tooltip: 'ล้างคอนโซลและการ์ดค่า' },

    { type: 'ctl_forever', message0: 'while true do %1 %2', args0: [{ type: 'input_dummy' }, { type: 'input_statement', name: 'DO' }],
      previousStatement: null, colour: C.ctl, tooltip: 'ทำคำสั่งข้างในวนไปเรื่อย ๆ จนกดหยุด' },

    { type: 'math_round_to', message0: 'round %1 digits %2',
      args0: [{ type: 'input_value', name: 'X', check: 'Number' }, { type: 'field_dropdown', name: 'N', options: [['0', '0'], ['1', '1'], ['2', '2'], ['3', '3']] }],
      inputsInline: true, output: 'Number', colour: C.math, tooltip: 'ปัดเศษให้เหลือทศนิยมตามที่เลือก เช่น round(23.456, 1) = 23.5' },

    // ---- I2C + sensors
    { type: 'i2c_begin', message0: 'i2c.begin SDA %1 SCL %2',
      args0: [{ type: 'field_dropdown', name: 'SDA', options: I2C_PINS }, { type: 'field_dropdown', name: 'SCL', options: I2C_PINS_SCL }],
      previousStatement: null, nextStatement: null, colour: C.i2c,
      tooltip: 'เลือกขา I2C (ไม่ใส่บล็อกนี้ = ใช้ SDA=GPIO21, SCL=GPIO22)' },
    { type: 'i2c_scan', message0: 'i2c.scan()', previousStatement: null, nextStatement: null, colour: C.i2c,
      tooltip: 'ค้นหาอุปกรณ์ I2C ที่ต่ออยู่ แล้วพิมพ์ที่อยู่ + ชื่ออุปกรณ์ที่รู้จักลงคอนโซล' },
    { type: 'i2c_read_reg', message0: 'i2c.readReg addr %1 reg %2',
      args0: [{ type: 'input_value', name: 'ADDR', check: 'Number' }, { type: 'input_value', name: 'REG', check: 'Number' }],
      inputsInline: true, output: 'Number', colour: C.i2c, tooltip: 'อ่าน 1 ไบต์จาก register ของอุปกรณ์ I2C (ที่อยู่ 0x3C = 60)' },
    { type: 'i2c_write_reg', message0: 'i2c.writeReg addr %1 reg %2 value %3',
      args0: ['ADDR', 'REG', 'VALUE'].map(n => ({ type: 'input_value', name: n, check: 'Number' })),
      inputsInline: true, previousStatement: null, nextStatement: null, colour: C.i2c, tooltip: 'เขียน 1 ไบต์ลง register ของอุปกรณ์ I2C' },
    { type: 'sens_aht20', message0: 'aht20.%1()',
      args0: [{ type: 'field_dropdown', name: 'Q', options: [['temperature °C', 'temperature'], ['humidity %', 'humidity']] }],
      output: 'Number', colour: C.i2c, tooltip: 'อุณหภูมิ/ความชื้นจาก AHT20 หรือ AHT10 (I2C 0x38)' + WIRE },
    { type: 'sens_sht31', message0: 'sht31.%1()',
      args0: [{ type: 'field_dropdown', name: 'Q', options: [['temperature °C', 'temperature'], ['humidity %', 'humidity']] }],
      output: 'Number', colour: C.i2c, tooltip: 'อุณหภูมิ/ความชื้นจาก SHT30/SHT31/SHT35 (I2C 0x44 หรือ 0x45)' + WIRE },
    { type: 'sens_bme280', message0: 'bme280.%1()',
      args0: [{ type: 'field_dropdown', name: 'Q', options: [['temperature °C', 'temperature'], ['humidity %', 'humidity'], ['pressure hPa', 'pressure']] }],
      output: 'Number', colour: C.i2c, tooltip: 'BME280 หรือ BMP280 (I2C 0x76/0x77) — BMP280 ไม่มีความชื้น' + WIRE },
    { type: 'sens_bh1750', message0: 'bh1750.lux()', output: 'Number', colour: C.i2c,
      tooltip: 'ความสว่างเป็น lux (ห้องทั่วไป 100-500, กลางแดด 10000+) BH1750 ที่ I2C 0x23' + WIRE },
    { type: 'sens_mpu_accel', message0: 'mpu6050.accel(%1) g',
      args0: [{ type: 'field_dropdown', name: 'AXIS', options: [['x', 'x'], ['y', 'y'], ['z', 'z']] }],
      output: 'Number', colour: C.i2c, tooltip: 'ความเร่งตามแกน หน่วย g (วางนิ่งแกนที่ชี้ขึ้นจะได้ประมาณ 1) MPU6050 ที่ 0x68' + WIRE },
    { type: 'sens_mpu_gyro', message0: 'mpu6050.gyro(%1) °/s',
      args0: [{ type: 'field_dropdown', name: 'AXIS', options: [['x', 'x'], ['y', 'y'], ['z', 'z']] }],
      output: 'Number', colour: C.i2c, tooltip: 'ความเร็วการหมุนรอบแกน องศาต่อวินาที' + WIRE },
    { type: 'sens_mpu_angle', message0: 'mpu6050.angle(%1) °',
      args0: [{ type: 'field_dropdown', name: 'W', options: [['pitch', 'pitch'], ['roll', 'roll']] }],
      output: 'Number', colour: C.i2c, tooltip: 'มุมเอียงจากแรงโน้มถ่วง (pitch = ก้ม/เงย, roll = เอียงซ้าย/ขวา) -90 ถึง 90' + WIRE },

    // ---- OLED SSD1306 128x64
    // ---- DHT22 / DHT11
    { type: 'sens_dht', message0: 'dht.%1 pin %2 %3',
      args0: [{ type: 'field_dropdown', name: 'Q', options: [['temperature °C', 'temperature'], ['humidity %', 'humidity']] },
              { type: 'field_dropdown', name: 'PIN', options: opts(OUT_PINS) },
              { type: 'field_dropdown', name: 'TYPE', options: [['DHT22', 'dht22'], ['DHT11', 'dht11']] }],
      output: 'Number', colour: C.i2c,
      tooltip: 'อุณหภูมิ/ความชื้นจาก DHT22 (AM2302) หรือ DHT11 — ต่อ VCC → 3.3V, GND, DATA → ขาที่เลือก\n' +
        '(ตัวเปล่า 4 ขาให้ต่อตัวต้านทาน 10k จาก DATA ไป VCC) · อ่านใหม่ได้ทุก 2 วินาที ระหว่างนั้นได้ค่าล่าสุด' },

    // ---- analog sensors (ADC1 pins 32-39), steady median reading -> %
    { type: 'sens_soil', message0: 'soil.moisture pin %1 dry %2 wet %3 %%',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(ADC_PINS) },
              { type: 'input_value', name: 'DRY', check: 'Number' }, { type: 'input_value', name: 'WET', check: 'Number' }],
      inputsInline: true, output: 'Number', colour: C.i2c,
      tooltip: 'ความชื้นในดิน 0-100%% — ต่อ AOUT → ขา 32-39, VCC → 3.3V, GND\n' +
        'dry/wet = ค่าดิบตอนดินแห้ง (ในอากาศ) และตอนแช่น้ำ ใช้ตัวอย่าง "ปรับเทียบเซนเซอร์ความชื้นดิน" หาค่าของเซนเซอร์ตัวเอง\n' +
        'ค่าเริ่มต้น 2800/1200 = เซนเซอร์แบบ capacitive v1.2 · แบบ 2 ขาเหล็ก (resistive) ลอง dry 4095 wet 1500' },
    { type: 'sens_light', message0: 'light.level pin %1 %%',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(ADC_PINS) }],
      output: 'Number', colour: C.i2c,
      tooltip: 'ความสว่าง 0-100%% จากโมดูล LDR (ตัวต้านทานแปรค่าตามแสง) — ต่อ AO → ขา 32-39\n' +
        'ถ้าได้ค่ากลับด้าน (มืด = สูง) ใช้บล็อก sensor.percent แล้วสลับค่า 0%%/100%%' },
    { type: 'sens_percent', message0: 'sensor.percent pin %1 0%% at %2 100%% at %3',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(ADC_PINS) },
              { type: 'input_value', name: 'A0', check: 'Number' }, { type: 'input_value', name: 'A100', check: 'Number' }],
      inputsInline: true, output: 'Number', colour: C.i2c,
      tooltip: 'แปลงเซนเซอร์อนาล็อกใดก็ได้ (ระดับน้ำ, ฝน, ตัวต้านทานปรับค่า ...) เป็น 0-100%%\nใส่ค่าดิบที่ควรเป็น 0%% และ 100%%' },
    { type: 'sens_raw', message0: 'sensor.raw pin %1',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(ADC_PINS) }],
      output: 'Number', colour: C.i2c, tooltip: 'ค่าดิบ 0-4095 แบบนิ่ง (ค่ากลางจากการอ่าน 9 ครั้ง) ใช้หาค่าปรับเทียบ' },

    // ---- buzzer + servo
    { type: 'act_tone', message0: 'tone pin %1 %2 Hz %3 ms',
      args0: [{ type: 'field_dropdown', name: 'PIN', options: opts(OUT_PINS) },
              { type: 'input_value', name: 'FREQ', check: 'Number' }, { type: 'input_value', name: 'MS', check: 'Number' }],
      inputsInline: true, previousStatement: null, nextStatement: null, colour: C.act,
      tooltip: 'เล่นเสียงความถี่ Hz นาน ms มิลลิวินาที แล้วเงียบ (บัซเซอร์แบบ passive)\n' +

  // ---------------------------------------------------------------- Lua generator
  const G = lua.luaGenerator, O = lua.Order;
  const val = (b, g, name, def) => g.valueToCode(b, name, O.NONE) || def;
  const needOutput = (g, pin) => { g.definitions_['pin_out_' + pin] = 'pinMode(' + pin + ', OUTPUT)'; };
  const F = G.forBlock;

  F.io_pin_mode = b => 'pinMode(' + b.getFieldValue('PIN') + ', ' + b.getFieldValue('MODE') + ')\n';
  F.io_digital_write = (b, g) => { const p = b.getFieldValue('PIN'); needOutput(g, p); return 'digitalWrite(' + p + ', ' + b.getFieldValue('STATE') + ')\n'; };
  F.io_digital_write_n = (b, g) => 'digitalWrite(' + val(b, g, 'PIN', '2') + ', ' + b.getFieldValue('STATE') + ')\n';
  F.io_digital_toggle = (b, g) => { const p = b.getFieldValue('PIN'); needOutput(g, p); return 'digitalWrite(' + p + ', 1 - digitalRead(' + p + '))\n'; };
  F.io_digital_read = b => ['digitalRead(' + b.getFieldValue('PIN') + ')', O.HIGH];
  F.io_digital_is_high = b => ['digitalRead(' + b.getFieldValue('PIN') + ') == 1', O.RELATIONAL];
  F.io_analog_read = b => ['analogRead(' + b.getFieldValue('PIN') + ')', O.HIGH];
  F.io_pwm = (b, g) => 'analogWrite(' + b.getFieldValue('PIN') + ', ' + val(b, g, 'VALUE', '0') + ')\n';
  F.io_touch_read = b => ['touchRead(' + b.getFieldValue('PIN') + ')', O.HIGH];
  F.board_led = (b, g) => { needOutput(g, 'LED_BUILTIN'); return 'digitalWrite(LED_BUILTIN, ' + b.getFieldValue('STATE') + ')\n'; };
  F.board_boot = (b, g) => { g.definitions_['pin_boot'] = 'pinMode(0, INPUT_PULLUP)'; return ['digitalRead(0) == 0', O.RELATIONAL]; };
  F.time_delay_ms = (b, g) => 'delay(' + val(b, g, 'MS', '0') + ')\n';
  F.time_delay_s = (b, g) => 'delay(' + (g.valueToCode(b, 'S', O.MULTIPLICATIVE) || '0') + ' * 1000)\n';
  F.time_millis = () => ['millis()', O.HIGH];
  F.disp_show = (b, g) => 'show(' + g.quote_(b.getFieldValue('NAME')) + ', ' + val(b, g, 'VALUE', 'nil') + ')\n';
  F.disp_clear = () => 'clear()\n';
  F.ctl_forever = (b, g) => 'while true do\n' + g.statementToCode(b, 'DO') + 'end\n';
  const q = (b, g, n, d) => g.valueToCode(b, n, O.NONE) || d;
  F.math_round_to = (b, g) => ['round(' + q(b, g, 'X', '0') + ', ' + b.getFieldValue('N') + ')', O.HIGH];
  F.i2c_begin = b => 'i2c.begin(' + b.getFieldValue('SDA') + ', ' + b.getFieldValue('SCL') + ')\n';
  F.i2c_scan = () => 'i2c.scan(true)\n';

// ------------------------------------------------------------------ examples (Blockly JSON)
const B = (type, fields, inputs, extra) => Object.assign({ type, fields: fields || {}, inputs: inputs || {} }, extra || {});
const V = block => ({ block });
const N = n => V(B('math_number', { NUM: n }));
const T = s => V(B('text', { TEXT: s }));
const VAR = name => ({ VAR: { name } });
const getv = name => V(B('variables_get', VAR(name)));
const seq = (...bs) => { for (let i = 0; i < bs.length - 1; i++) bs[i].next = { block: bs[i + 1] }; return { block: bs[0] }; };
const forever = (...bs) => B('ctl_forever', null, { DO: seq(...bs) });
const led = on => B('board_led', { STATE: on ? 'HIGH' : 'LOW' });
const ifElse = (cond, thenB, elseB) => B('controls_if', null, { IF0: V(cond), DO0: seq(...thenB), ELSE: seq(...elseB) }, { extraState: { hasElse: true } });
const set = (name, v) => B('variables_set', VAR(name), { VALUE: v });
const program = (...bs) => ({ blocks: { languageVersion: 0, blocks: [Object.assign(seq(...bs).block, { x: 30, y: 30 })] } });

// note on a block (the "?" icon) explaining what the example does / how to wire it;
// also printed to the console when the example is loaded
const note = (block, text, w, h) => Object.assign(block, { icons: { comment: { text, pinned: false, width: w || 300, height: h || 90 } } });
function exampleNotes(state) {
  const out = [];
  const walk = b => {
    if (!b || typeof b !== 'object') return;
    if (b.icons && b.icons.comment) out.push(b.icons.comment.text);
    for (const k in b) if (k !== 'icons') walk(b[k]);
  };
  walk(state);
  return out;
}
// several top-level stacks: [[block, x, y], ...]
const programN = (...stacks) => ({ blocks: { languageVersion: 0, blocks: stacks.map(([b, x, y]) => Object.assign(b, { x, y })) } });
const ms = n => B('time_delay_ms', null, { MS: N(n) });
const showv = (name, v) => B('disp_show', { NAME: name }, { VALUE: v });
const say = s => B('text_print', null, { TEXT: typeof s === 'string' ? T(s) : s });
const join = (...parts) => V(B('text_join', null,
  Object.fromEntries(parts.map((p, i) => ['ADD' + i, typeof p === 'string' ? T(p) : p])), { extraState: { itemCount: parts.length } }));
const arith = (op, a, b) => V(B('math_arithmetic', { OP: op }, { A: a, B: b }));
const cmp = (op, a, b) => B('logic_compare', { OP: op }, { A: a, B: b });
const ifThen = (cond, ...then) => B('controls_if', null, { IF0: V(cond), DO0: seq(...then) });
const pinW = (pin, hi) => B('io_digital_write', { PIN: String(pin), STATE: hi ? 'HIGH' : 'LOW' });
const change = (name, d) => B('math_change', VAR(name), { DELTA: N(d) });
const waitRelease = () => B('controls_whileUntil', { MODE: 'WHILE' }, { BOOL: V(B('board_boot')), DO: seq(ms(10)) });
const analog34 = () => V(B('io_analog_read', { PIN: '34' }));
const repeat = (n, ...body) => B('controls_repeat_ext', null, { TIMES: typeof n === 'number' ? N(n) : n, DO: seq(...body) });
const callP = (name, args) => B('procedures_callnoreturn', null,
  Object.fromEntries(args.map((a, i) => ['ARG' + i, typeof a === 'number' ? N(a) : a])),
  { extraState: { name, params: ['times', 'ms'].slice(0, args.length) } });

let ws = null, tab = 'blocks', manual = false, lastExample = null;
let wiringTimer = null, currentAnalysis = null, rightTab = 'console';
const codeEl = $('code'), gutter = $('gutter');

function genCode() { return ws ? lua.luaGenerator.workspaceToCode(ws) : ''; }

let curName = store.get('lc_name') || '', dirty = store.get('lc_dirty') === '1', loading = false;

function save() {
  if (!ws) return;
  store.set('lc_ws', JSON.stringify(Blockly.serialization.workspaces.save(ws)));
  store.set('lc_manual', manual ? codeEl.value : '');
  if (!loading) setDirty(true);
}

function setDirty(d) {
  dirty = d;
  store.set('lc_dirty', d ? '1' : '');
  store.set('lc_name', curName);
  const f = $('fname');
  f.textContent = curName ? '· ' + curName : '· (ยังไม่บันทึก)';
  f.classList.toggle('dirty', d);
}

function loadState(state) {
  loading = true;
  try {
    ws.clear();
    Blockly.serialization.workspaces.load(state, ws);
    ws.scrollCenter();
  } finally {
    // change events fire asynchronously; ignore the ones caused by loading
    setTimeout(() => { loading = false; }, 0);
  }
}

// "✖ โปรแกรม:12: msg" -> {line, thai, orig}; null when the line is not a Lua error
function explainError(text) {
  const m = /^✖ (?:โปรแกรม:(\d+): )?(.*)$/s.exec(text);
  if (!m) return null;
  const line = m[1] ? +m[1] : 0, orig = m[2];
  for (const [re, f] of ERR_RULES) {
    const r = re.exec(orig);
    if (r) return { line, thai: f(r), orig };
  }
  return { line, thai: orig, orig: '' };   // already Thai (our own messages) or unknown
}

// jump to a line in the Lua tab (the code shown there is what ran, unless it changed since)
let lastRunCode = '';
async function gotoLine(n) {
  if (tab !== 'code') await showTab('code');
  if (tab !== 'code') return;
  if (codeEl.value !== lastRunCode) toast('โค้ดเปลี่ยนไปหลังจากรัน บรรทัดอาจไม่ตรง');
  const lines = codeEl.value.split('\n');
  if (n < 1 || n > lines.length) return;
  const start = lines.slice(0, n - 1).reduce((a, l) => a + l.length + 1, 0);
  codeEl.focus();
  codeEl.setSelectionRange(start, start + lines[n - 1].length);
  const lh = parseFloat(getComputedStyle(codeEl).lineHeight) || 21;
  codeEl.scrollTop = Math.max(0, (n - 3) * lh);
}

const con = $('console');
function addLine(t, m) {
  const atBottom = con.scrollTop + con.clientHeight >= con.scrollHeight - 4;
  const d = document.createElement('div');
  d.className = 't' + t;
  const e = t === 1 ? explainError(m) : null;
  if (e) {
    d.append('✖ ' + (e.line ? 'บรรทัด ' + e.line + ': ' : '') + e.thai);
    if (e.orig) d.append(el('div', { className: 'orig', textContent: 'Lua: ' + e.orig }));
    if (e.line) { d.classList.add('jump'); d.title = 'คลิกเพื่อดูบรรทัด ' + e.line + ' ในแท็บโค้ด Lua'; d.onclick = () => gotoLine(e.line); }
  } else d.textContent = m;
  con.appendChild(d);
  while (con.childNodes.length > 500) con.removeChild(con.firstChild);
  if (atBottom) con.scrollTop = con.scrollHeight;
}

const cards = new Map();   // name -> {el, v, svg, line, hist}
const HIST = 60;
const SVGNS = 'http://www.w3.org/2000/svg';
function fmt(v) {
  if (!/^-?\d+(\.\d+)?(e[-+]?\d+)?$/i.test(v)) return v;
  const n = Number(v);
  return Number.isInteger(n) ? String(n) : String(Math.round(n * 1000) / 1000);
}
function renderVals(vals) {
  for (const [k, c] of cards) if (!(k in vals)) { c.el.remove(); cards.delete(k); }
  for (const k in vals) {
    let c = cards.get(k);
    if (!c) {
      const el = document.createElement('div'); el.className = 'card';
      const kk = document.createElement('div'); kk.className = 'k'; kk.textContent = k; kk.title = k;
      const v = document.createElement('div'); v.className = 'v';
      el.append(kk, v); $('vals').appendChild(el);
      c = { el, v, svg: null, line: null, hist: [], last: null };
      cards.set(k, c);
    }
    const raw = vals[k];
    c.v.textContent = fmt(raw); c.v.title = raw;
    const n = Number(raw);
    if (raw !== '' && isFinite(n)) {
      c.hist.push(n); if (c.hist.length > HIST) c.hist.shift();
      if (!c.svg) {
        c.svg = document.createElementNS(SVGNS, 'svg'); c.svg.setAttribute('viewBox', '0 0 100 30'); c.svg.setAttribute('preserveAspectRatio', 'none');
        c.line = document.createElementNS(SVGNS, 'polyline'); c.svg.appendChild(c.line); c.el.appendChild(c.svg);
      }
      const lo = Math.min(...c.hist), hi = Math.max(...c.hist), span = hi - lo || 1;
      c.line.setAttribute('points', c.hist.map((y, i) => (i * 100 / (HIST - 1)).toFixed(1) + ',' + (28 - (y - lo) / span * 26).toFixed(1)).join(' '));
    }
  }
}

const dlg = $('dlg');
function el(tag, props, ...kids) {
  const e = Object.assign(document.createElement(tag), props || {});
  for (const k of kids) if (k != null) e.append(k);
  return e;
}
// buttons: [[label, value, cls]]; resolves with the clicked value (null when closed with Esc)
function dialog(title, body, buttons) {
  $('dlgTitle').textContent = title;
  $('dlgBody').replaceChildren(...[].concat(body));
  const foot = $('dlgFoot'); foot.replaceChildren();
  return new Promise(res => {
    const done = v => { dlg.oncancel = null; dlg.close(); res(v); };
    for (const [label, value, cls] of buttons) {
      foot.append(el('button', { textContent: label, className: cls || '', onclick: () => done(value) }));
    }
    // Esc closes as "no answer". ('cancel' fires synchronously, unlike 'close', so a dialog
    // opened right after another one is not cancelled by the previous close event.)
    dlg.oncancel = e => { e.preventDefault(); done(null); };
    if (!dlg.open) dlg.showModal();
    const first = dlg.querySelector('.db input:not([type=checkbox])'); if (first) first.focus();
  });
}
const ask = (title, msg, okLabel, cls) =>
  dialog(title, el('p', { textContent: msg }), [['ยกเลิก', false], [okLabel || 'ตกลง', true, cls || 'primary']]).then(v => !!v);

let toastT;
function toast(msg) {

  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2500);
}
function isEmpty() { return !manual && (!ws || !ws.getAllBlocks(false).length); }
async function okToReplace(what) {

// ------------------------------------------------------------------ program files
// .blk on the board and exported .json share one format:
// { format, v, name, blocks (Blockly JSON), manual (hand-written Lua or null), lua (code that runs) }
function currentLua() { return manual ? codeEl.value : genCode(); }
function snapshot() {
  return { format: 'esp32-livecode', v: 1, name: curName,
    blocks: ws ? Blockly.serialization.workspaces.save(ws) : null, manual: manual ? codeEl.value : null, lua: currentLua() };
}
function applyProgram(p, isDirty) {
  lastExample = null;
  if (ws) loadState(p.blocks || {});
  manual = p.manual != null;
  codeEl.value = manual ? p.manual : '';
  updateManual();
  curName = p.name || '';
  tab = '';                                   // force the tab to refresh
  showTab(manual ? 'code' : 'blocks');
  setTimeout(() => { save(); setDirty(!!isDirty); }, 0);
}
async function api(method, url, body, type) {
  const headers = body != null && !(body instanceof FormData) ? { 'Content-Type': type || 'text/plain; charset=utf-8' } : {};
  const r = await fetch(url, { method, body, headers });
  const t = await r.text();
  if (!r.ok) throw new Error(t || ('HTTP ' + r.status));
  return t;
}
const fileUrl = (name, kind) => '/api/file?name=' + encodeURIComponent(name) + '&kind=' + kind;
// files are uploaded as multipart/form-data (the board streams them to flash)
function putFile(name, kind, text) {
  const fd = new FormData();
  fd.append('file', new Blob([text], { type: 'text/plain' }), name + '.' + kind);
  return api('POST', fileUrl(name, kind), fd);
}
const NAME_RE = /^[a-z0-9_-]{1,24}$/;
const cleanName = n => (n || '').toLowerCase().replace(/[^a-z0-9_-]+/g, '_').slice(0, 24);

async function saveTo(name) {
  const prev = curName;
  try {
    curName = name;
    await putFile(name, 'lua', currentLua());
    await putFile(name, 'blk', JSON.stringify(snapshot()));
    setDirty(false);
    toast('บันทึก "' + name + '" ลงบอร์ดแล้ว');
    return true;
  } catch (e) {
    curName = prev;
    info('บันทึกไม่สำเร็จ', e.message);
    return false;
  }
}

async function saveAs() {
  let files = [];
  try { files = await listFiles(); } catch (e) {}
  const input = el('input', { type: 'text', value: curName || cleanName(''), placeholder: 'เช่น blink', autocapitalize: 'off', spellcheck: false });
  const err = el('div', { className: 'err' });
  const body = [el('label', { textContent: 'ชื่อโปรแกรม (a-z 0-9 _ - ยาวไม่เกิน 24 ตัว)' }), input, err];
  if (files.length) body.push(el('div', { className: 'muted', textContent: 'บนบอร์ดมี: ' + files.join(', ') }));
  input.addEventListener('input', () => { input.value = input.value.toLowerCase().replace(/\s+/g, '_'); err.textContent = ''; });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); dlg.querySelector('.df .primary').click(); } });
  for (;;) {
    const v = await dialog('บันทึกลงบอร์ด', body, [['ยกเลิก', false], ['บันทึก', true, 'primary']]);
    if (!v) return false;
    const name = input.value.trim();
    if (!NAME_RE.test(name)) { err.textContent = 'ใช้ได้เฉพาะ a-z 0-9 _ - ยาว 1-24 ตัว'; continue; }
    if (files.includes(name) && name !== curName &&

    return saveTo(name);
  }
}

  15: 'ขา D15 มีสัญญาณออกมาสั้น ๆ ตอนเปิดไฟ (ส่งข้อความบูต) อุปกรณ์บางอย่างจะทำงานผิดจังหวะ — ถ้าเป็นไปได้ย้ายไปใช้ D13, D14 หรือ D27',
};

// ---- wire colours (the same colours show on the board drawing and in the part cards)
const SIGNAL_COLORS = ['#16a34a', '#7c3aed', '#0891b2', '#db2777', '#ca8a04', '#ea580c', '#4f46e5', '#0d9488'];
const RAILS = { '3V3': { color: '#f97316', text: '3.3V', pin: 'ขา 3V3' }, '5V': { color: '#dc2626', text: '5V', pin: 'ขา VIN (5V)' }, GND: { color: '#111827', text: 'GND', pin: 'ขา GND' } };
const G = n => ({ gpio: n }), PW = r => ({ rail: r });
const wire = (pin, to, via, role) => ({ pin, to, via: via || '', role: role || '' });
const wireColor = (w, dev) => w.role === 'sda' ? '#2563eb' : w.role === 'scl' ? '#eab308' : w.to.rail ? RAILS[w.to.rail].color : dev.color;
const KIND_TEXT = { sensor: 'เซนเซอร์', display: 'จอแสดงผล', actuator: 'ตัวสั่งงาน', input: 'ปุ่ม / ตัวปรับค่า' };

// ---- analysis: blocks -> parts, pins, rails, warnings
function analyzeBlocks(blocks) {
  const devs = new Map();
  const onboard = { led: false, boot: false };
  const extra = [];
  const gf = (b, n) => Number(b.getFieldValue(n));
  const sf = (b, n) => String(b.getFieldValue(n));
  const mk = (name, short, icon, kind, wires, more) => Object.assign({ name, short, icon, kind, wires, parts: [], fix: [], notes: [], shared: null, pwm: 0 }, more || {});
  const put = (key, dev, override) => { if (override || !devs.has(key)) devs.set(key, dev); };

  const i2cB = blocks.find(b => b.type === 'i2c_begin');
  const SDA = i2cB ? gf(i2cB, 'SDA') : 21, SCL = i2cB ? gf(i2cB, 'SCL') : 22;
  const i2cDev = (key, name, short, icon, kind, vcc, more) => put('i2c:' + key, mk(name, short, icon, kind, [
    wire('SDA', G(SDA), '', 'sda'), wire('SCL', G(SCL), '', 'scl'), wire('VCC', PW(vcc)), wire('GND', PW('GND'))],
    Object.assign({ shared: 'i2c' }, more || {})));
  const analogDev = (pin, name, short, icon, wires, more, strong) => put('analog:' + pin, mk(name, short, icon, 'sensor', wires, more), strong);
  const addLed = p => {
    if (p === 2) { onboard.led = true; return; }
    put('out:' + p, mk('LED หรืออุปกรณ์ที่สั่งเปิด/ปิด', 'LED', '💡', 'actuator',
      [wire('ขา + (ขายาวของ LED)', G(p), 'ผ่านตัวต้านทาน 220Ω'), wire('ขา −', PW('GND'))],
      { parts: ['ตัวต้านทาน 220Ω (ต่อกับ LED)'], notes: ['ต่อ LED ภายนอกต้องมีตัวต้านทาน 220Ω ต่ออนุกรมเสมอ ไม่งั้น LED หรือบอร์ดอาจเสีย'] }));
  };
  const oledB = blocks.find(b => b.type === 'oled_begin');
  const oledType = oledB ? sf(oledB, 'TYPE') : 'ssd1306';
  const OLED_NAME = { ssd1306: 'จอ OLED 0.96" 128x64 (SSD1306)', sh1106: 'จอ OLED 1.3" 128x64 (SH1106)', ssd1306_32: 'จอ OLED 0.91" 128x32 (SSD1306)' };
  const lcdB = blocks.find(b => b.type === 'lcd_begin');
  const lcdSize = lcdB ? sf(lcdB, 'SIZE').replace(/,\s*/, 'x') : '16x2';
  let hasOled = false, hasLcd = false;

  for (const b of blocks) {
    const t = b.type;
    if (t.startsWith('oled_') && t !== 'oled_width') { hasOled = true; continue; }
    if (t === 'oled_width') { hasOled = true; continue; }
    if (t.startsWith('lcd_')) { hasLcd = true; continue; }
    switch (t) {
      case 'board_led': onboard.led = true; break;
      case 'board_boot': onboard.boot = true; break;
      case 'io_pin_mode': {
        const p = gf(b, 'PIN');
        if (sf(b, 'MODE') === 'OUTPUT' && p >= 34) extra.push({ level: 'error', text: 'ขา ' + silk(p) + ' ตั้งเป็นขาส่งออกไม่ได้ (เป็นขาอ่านอย่างเดียว) — โปรแกรมจะ error ให้เปลี่ยนไปใช้ขาอื่น' });
        if (sf(b, 'MODE') === 'OUTPUT' && p === 0) extra.push({ level: 'warn', text: 'ขา GPIO0 คือปุ่ม BOOT บนบอร์ด ไม่ควรตั้งเป็นขาส่งออก' });
        break;
      }
      case 'io_digital_write': case 'io_digital_toggle': addLed(gf(b, 'PIN')); break;
      case 'io_digital_write_n': {
        let found = false;
        const direct = b.getInputTargetBlock('PIN');
        if (direct && direct.type === 'math_number') { addLed(Number(direct.getFieldValue('NUM'))); found = true; }
        for (const l of blocks.filter(x => x.type === 'lists_create_with')) {
          const nums = l.getChildren(false).filter(c => c.type === 'math_number').map(c => Number(c.getFieldValue('NUM')));
          if (nums.length && nums.every(n => OUT_PINS.includes(n))) { nums.forEach(addLed); found = true; }
        }
        if (!found) extra.push({ level: 'info', text: 'บล็อก digitalWrite ที่ใช้เลขขาจากตัวแปร — ระบบบอกการต่อสายให้ไม่ได้ ให้ดูคำอธิบายของตัวอย่าง' });
        break;
      }
      case 'io_digital_read': case 'io_digital_is_high': {
        const p = gf(b, 'PIN');
        if (p === 0) { onboard.boot = true; break; }
        put('in:' + p, mk('ปุ่มกด / สวิตช์ / เซนเซอร์ดิจิทัล', 'ปุ่ม', '🔘', 'input', [wire('ขาที่ 1', G(p)), wire('ขาที่ 2', PW('GND'))],
          { notes: ['ปุ่มกด: ใช้บล็อก pinMode ตั้งขานี้เป็น INPUT_PULLUP แล้วกดจะอ่านได้ 0 (LOW)'] }));
        break;
      }
      case 'io_analog_read': {
        const p = gf(b, 'PIN');
        analogDev(p, 'เซนเซอร์อนาล็อก / ตัวต้านทานปรับค่า', 'อนาล็อก', '🎚',
          [wire('ขากลาง / AO', G(p)), wire('ขาข้าง 1 / VCC', PW('3V3')), wire('ขาข้าง 2 / GND', PW('GND'))],
          { notes: ['ตัวต้านทานปรับค่า (โพเทนชิโอมิเตอร์) 10kΩ: ขากลางเข้าบอร์ด ขาข้างสองขาไป 3.3V กับ GND'] });
        break;
      }
      case 'io_pwm': {
        const p = gf(b, 'PIN');
        if (p === 2) { onboard.led = true; break; }
        put('pwm:' + p, mk('LED / อุปกรณ์ที่ปรับความแรงได้ (PWM)', 'PWM', '💡', 'actuator', [wire('ขา +', G(p), 'ผ่านตัวต้านทาน 220Ω (ถ้าเป็น LED)'), wire('ขา −', PW('GND'))],
          { pwm: 1, parts: ['ตัวต้านทาน 220Ω (ต่อกับ LED)'], notes: ['มอเตอร์/หลอดไฟแรง ๆ ห้ามต่อตรง ต้องผ่านบอร์ดขับหรือทรานซิสเตอร์'] }));
        break;
      }
      case 'io_touch_read': {
        const p = gf(b, 'PIN');
        put('touch:' + p, mk('แผ่นสัมผัส (สายไฟ / แผ่นโลหะ)', 'สัมผัส', '👆', 'input', [wire('สายไฟ / แผ่นโลหะ', G(p))], { notes: ['แตะที่ปลายสายเปล่า ค่าที่อ่านได้จะลดลง'] }));
        break;
      }

      // ---- I2C sensors
      case 'sens_aht20': i2cDev('aht', 'AHT20 / AHT10 (อุณหภูมิ ความชื้น)', 'AHT20', '🌡', 'sensor', '3V3'); break;
      case 'sens_sht31': i2cDev('sht', 'SHT31 (อุณหภูมิ ความชื้น)', 'SHT31', '🌡', 'sensor', '3V3'); break;
      case 'sens_bme280': i2cDev('bme', 'BME280 / BMP280 (อุณหภูมิ ความชื้น ความดัน)', 'BME280', '🌤', 'sensor', '3V3'); break;
      case 'sens_bh1750': i2cDev('bh', 'BH1750 (ความสว่าง)', 'BH1750', '☀️', 'sensor', '3V3'); break;
      case 'sens_mpu_accel': case 'sens_mpu_gyro': case 'sens_mpu_angle': i2cDev('mpu', 'MPU6050 (เอียง / สั่น)', 'MPU6050', '🧭', 'sensor', '3V3'); break;
      case 'i2c_scan': case 'i2c_read_reg': case 'i2c_write_reg': i2cDev('any', 'อุปกรณ์ I2C', 'I2C', '🔗', 'sensor', '3V3'); break;

      // ---- one-wire / digital / analog sensors
      case 'sens_dht': {
        const p = gf(b, 'PIN'), ty = sf(b, 'TYPE') === 'dht11' ? 'DHT11' : 'DHT22';
        put('dht:' + p, mk(ty + ' (อุณหภูมิ ความชื้น)', ty, '💧', 'sensor',
          [wire('DATA / OUT', G(p)), wire('VCC / +', PW('3V3')), wire('GND / −', PW('GND'))],
          { parts: ['ตัวต้านทาน 10kΩ (เฉพาะตัวเปล่า 4 ขา)'], fix: ['ตัวเปล่า 4 ขา: ต่อตัวต้านทาน 10kΩ ระหว่างขา DATA กับ VCC (โมดูล 3 ขามีมาให้แล้ว)'] }));
        break;
      }
      case 'sens_ds18b20': case 'sens_ds18b20_count': {
        const p = gf(b, 'PIN');
        put('ds:' + p, mk('DS18B20 (อุณหภูมิ แบบกันน้ำ)', 'DS18B20', '🌡', 'sensor',
          [wire('DATA (สายเหลือง)', G(p)), wire('VDD (สายแดง)', PW('3V3')), wire('GND (สายดำ)', PW('GND'))],
          { parts: ['ตัวต้านทาน 4.7kΩ'], fix: ['ตัวต้านทาน 4.7kΩ ต่อระหว่างสาย DATA กับ 3.3V (โมดูลที่มีบอร์ดรองมักใส่มาให้แล้ว)'],
            notes: ['ต่อได้หลายตัวพ่วงสาย DATA เส้นเดียวกัน ใช้ตัวต้านทานตัวเดียว'] }));
        break;
      }
      case 'sens_ultrasonic': {
        const tr = gf(b, 'TRIG'), ec = gf(b, 'ECHO');
        put('us:' + tr + '-' + ec, mk('HC-SR04 (วัดระยะด้วยคลื่นเสียง)', 'HC-SR04', '📏', 'sensor',
          [wire('VCC', PW('5V')), wire('Trig', G(tr)), wire('Echo', G(ec), 'ผ่านตัวแบ่งแรงดัน 1kΩ + 2kΩ'), wire('GND', PW('GND'))],
          { parts: ['ตัวต้านทาน 1kΩ', 'ตัวต้านทาน 2kΩ'],
            fix: ['Echo → ตัวต้านทาน 1kΩ → ขา ' + silk(ec) + ' และจากขา ' + silk(ec) + ' → ตัวต้านทาน 2kΩ → GND (ลดสัญญาณ 5V เหลือ 3.3V)'],
            notes: ['รุ่น HC-SR04P / RCWL-1601 ใช้ไฟ 3.3V ต่อ Echo ตรง ๆ ได้ ไม่ต้องใช้ตัวต้านทาน'] }));
        break;
      }
      case 'sens_pir': {
        const p = gf(b, 'PIN');
        put('pir:' + p, mk('PIR ตรวจจับการเคลื่อนไหว (HC-SR501 / AM312)', 'PIR', '🚶', 'sensor',
          [wire('VCC', PW('5V'), 'HC-SR501 = 5V · AM312 = 3.3V'), wire('OUT', G(p)), wire('GND', PW('GND'))],
          { notes: ['หลังเปิดไฟ HC-SR501 ต้องรอประมาณ 1 นาทีให้เซนเซอร์นิ่ง ช่วงแรกอาจแจ้งว่ามีการเคลื่อนไหวเอง'] }));
        break;
      }
      case 'sens_soil': {
        const p = gf(b, 'PIN');
        analogDev(p, 'เซนเซอร์ความชื้นในดิน', 'ดิน', '🌱', [wire('AOUT', G(p)), wire('VCC', PW('3V3')), wire('GND', PW('GND'))],
          { notes: ['ต้องปรับเทียบค่า dry/wet ก่อนใช้ (ดูตัวอย่าง "ปรับเทียบเซนเซอร์ความชื้นดิน")'] }, true);
        break;
      }
      case 'sens_light': {
        const p = gf(b, 'PIN');
        analogDev(p, 'โมดูลวัดแสง LDR', 'LDR', '☀️', [wire('AO', G(p)), wire('VCC', PW('3V3')), wire('GND', PW('GND'))], {}, true);
        break;
      }
      case 'sens_rain': {
        const p = gf(b, 'PIN');
        analogDev(p, 'เซนเซอร์ฝน (บอร์ด FC-37 / YL-83)', 'ฝน', '🌧', [wire('AO', G(p)), wire('VCC', PW('3V3'), 'ใช้ 3.3V ไม่ใช่ 5V'), wire('GND', PW('GND'))],
          { notes: ['ใช้ไฟ 3.3V เพื่อให้สัญญาณ AO ไม่เกิน 3.3V (ที่ 5V อาจทำให้ขาบอร์ดเสียหาย)'] }, true);
        break;
      }
      case 'sens_water': {
        const p = gf(b, 'PIN'), pw = gf(b, 'POWER');
        analogDev(p, 'เซนเซอร์ระดับน้ำ (แผ่น 3 ขา)', 'ระดับน้ำ', '🚰',
          [wire('S (สัญญาณ)', G(p)), pw >= 0 ? wire('+ (ไฟ)', G(pw), 'จ่ายไฟเฉพาะตอนวัด กันแผ่นผุ') : wire('+ (ไฟ)', PW('3V3')), wire('− (GND)', PW('GND'))],
          { notes: ['วัดได้เฉพาะช่วงความยาวของแผ่น · ปรับเทียบค่า empty/full ให้ตรงกับน้ำที่ใช้'] }, true);
        break;
      }
      case 'sens_percent': case 'sens_raw': {
        const p = gf(b, 'PIN');
        analogDev(p, 'เซนเซอร์อนาล็อก', 'อนาล็อก', '🎚', [wire('AO / สัญญาณ', G(p)), wire('VCC', PW('3V3')), wire('GND', PW('GND'))]);
        break;
      }
      case 'sens_mq_level': case 'sens_mq_ppm': case 'sens_mq_volt': case 'sens_mq_cal': {
        const p = gf(b, 'PIN');
        analogDev(p, 'เซนเซอร์แก๊ส MQ-2 (ผ่านตัวแบ่งแรงดัน)', 'MQ-2', '🔥',
          [wire('VCC', PW('5V')), wire('AO', G(p), 'ผ่านตัวต้านทาน 10kΩ'), wire('GND', PW('GND'))],
          { parts: ['ตัวต้านทาน 10kΩ', 'ตัวต้านทาน 20kΩ'],
            fix: ['AO → ตัวต้านทาน 10kΩ → ขา ' + silk(p) + ' และจากขา ' + silk(p) + ' → ตัวต้านทาน 20kΩ → GND (ลด 5V เหลือ 3.3V)', 'ห้ามต่อขา DO เข้าบอร์ดตรง ๆ (สัญญาณ 5V)'],
            notes: ['อุ่นเซนเซอร์ 1-3 นาทีหลังเปิดไฟ', '⚠ ใช้เพื่อการเรียนรู้ ไม่ใช่เครื่องตรวจแก๊สที่ได้มาตรฐาน'] }, true);
        break;
      }

      // ---- outputs
      case 'act_tone': case 'act_notone': {
        const p = gf(b, 'PIN');
        put('buzzer:' + p, mk('บัซเซอร์ (แบบ passive)', 'บัซเซอร์', '🔔', 'actuator', [wire('ขา +', G(p)), wire('ขา −', PW('GND'))],
          { pwm: 1, notes: ['ต้องเป็นบัซเซอร์แบบ passive (ไม่ร้องเองเมื่อจ่ายไฟ) · แบบ active ใช้ digitalWrite แทน'] }));
        break;
      }
      case 'act_servo': {
        const p = gf(b, 'PIN');
        put('servo:' + p, mk('เซอร์โว SG90 / MG90S', 'เซอร์โว', '🦾', 'actuator',
          [wire('สัญญาณ (สายส้ม/เหลือง)', G(p)), wire('VCC (สายแดง)', PW('5V'), 'ใช้ 5V ไม่ใช่ 3.3V'), wire('GND (สายน้ำตาล)', PW('GND'))],
          { pwm: 1, notes: ['ถ้าเซอร์โวหมุนแล้วบอร์ดรีเซ็ตเอง ให้เลี้ยงเซอร์โวด้วยแหล่งไฟ 5V แยก (ต่อ GND ร่วมกับบอร์ด)'] }));
        break;
      }
      case 'act_relay': {
        const p = gf(b, 'PIN');
        put('relay:' + p, mk('โมดูลรีเลย์', 'รีเลย์', '🔌', 'actuator', [wire('IN', G(p)), wire('VCC', PW('5V')), wire('GND', PW('GND'))],
          { notes: ['โมดูลส่วนใหญ่ทำงานเมื่อสัญญาณเป็น LOW (LOW-trigger) — ถ้ารีเลย์ติด/ดับกลับด้าน ให้เปลี่ยนตัวเลือกในบล็อก',
                    '⚠ ไฟบ้าน 220V อันตรายถึงชีวิต ให้ผู้มีความรู้เป็นคนต่อ'] }));
        break;
      }
      case 'act_motor': case 'act_motor_stop': {
        const a = gf(b, 'IN1'), c = gf(b, 'IN2'), e = gf(b, 'EN');
        const w = [wire('IN1', G(a)), wire('IN2', G(c))];
        if (e >= 0) w.push(wire('EN / PWM (ENA)', G(e)));
        w.push(wire('GND ของบอร์ดขับ', PW('GND'), 'ต่อ GND ร่วมกับ ESP32'));
        put('motor:' + a + '-' + c, mk('มอเตอร์ DC ผ่านบอร์ดขับ (L9110S / L298N / DRV8833)', 'มอเตอร์', '⚙️', 'actuator', w,
          { pwm: e >= 0 ? 1 : 2, parts: ['บอร์ดขับมอเตอร์', 'แหล่งไฟสำหรับมอเตอร์ (ถ่านหรืออะแดปเตอร์)'],
            fix: ['ไฟเลี้ยงมอเตอร์ต่อจากแหล่งไฟภายนอกเข้าบอร์ดขับ — ไม่ดึงจากขา 3.3V/VIN ของ ESP32'],
            notes: ['ห้ามต่อมอเตอร์เข้าขาของ ESP32 ตรง ๆ'] }));
        break;
      }
    }
  }
  if (hasOled) i2cDev('oled', OLED_NAME[oledType] || OLED_NAME.ssd1306, 'OLED', '📺', 'display', '3V3',
    { notes: ['จอ OLED บางรุ่นมี 4 ขา เรียง GND VCC SCL SDA — ดูตัวหนังสือบนจอให้ดี ลำดับไม่เหมือนกันทุกรุ่น'] });
  if (hasLcd) i2cDev('lcd', 'จอ LCD ' + lcdSize + ' + บอร์ด I2C (PCF8574)', 'LCD', '🔲', 'display', '5V',
    { notes: ['จอ LCD ใช้ไฟ 5V', 'จอติดแต่ไม่เห็นตัวอักษร (เป็นแถบสี่เหลี่ยม): หมุนตัวต้านทานปรับความเข้มสีฟ้าหลังจอ'] });
  if (devs.has('i2c:any') && [...devs.keys()].some(k => k.startsWith('i2c:') && k !== 'i2c:any')) devs.delete('i2c:any');

  const devices = [...devs.values()];
  devices.forEach((d, i) => { d.color = SIGNAL_COLORS[i % SIGNAL_COLORS.length]; });

  // pins and power rails in use
  const usage = new Map(), rails = new Map();
  for (const d of devices) for (const w of d.wires) {
    if (w.to.gpio != null) { if (!usage.has(w.to.gpio)) usage.set(w.to.gpio, []); usage.get(w.to.gpio).push({ dev: d, w }); }
    else { if (!rails.has(w.to.rail)) rails.set(w.to.rail, []); if (!rails.get(w.to.rail).includes(d)) rails.get(w.to.rail).push(d); }
  }

  const warnings = [...extra];
  for (const [g, list] of usage) {
    const ds = [...new Set(list.map(u => u.dev))];
    const sharedOk = ds.length > 1 && ds.every(d => d.shared === 'i2c') && list.every(u => u.w.role === list[0].w.role);
    if (ds.length > 1 && !sharedOk)
      warnings.push({ level: 'error', pin: g, text: 'ขา ' + silk(g) + ' ถูกใช้ซ้ำโดย ' + ds.map(d => d.short).join(' และ ') + ' — แต่ละอุปกรณ์ต้องใช้คนละขา ให้เปลี่ยนขาในบล็อกของตัวใดตัวหนึ่ง' });
    if (PIN_WARN[g]) warnings.push({ level: 'warn', pin: g, text: PIN_WARN[g] });
    if (PIN_INFO[g] && PIN_INFO[g].role === 'bad') warnings.push({ level: 'error', pin: g, text: 'ขา ' + silk(g) + ' ใช้สื่อสารกับ USB อยู่ ห้ามใช้ต่ออุปกรณ์' });
  }
  const pwmPins = new Set();
  for (const d of devices) if (d.pwm) for (const w of d.wires) if (w.to.gpio != null && !/^GND|^VCC|^ขา −/.test(w.pin) && /^(ขา \+|สัญญาณ|IN1|IN2|EN)/.test(w.pin)) pwmPins.add(w.to.gpio);
  if (pwmPins.size > 8) warnings.push({ level: 'error', text: 'ใช้ PWM / บัซเซอร์ / เซอร์โว / มอเตอร์ รวม ' + pwmPins.size + ' ขา — บอร์ดรองรับพร้อมกันได้ไม่เกิน 8 ขา' });
  if (rails.has('5V')) warnings.push({ level: 'info', text: 'อุปกรณ์ที่ใช้ไฟ 5V (' + rails.get('5V').map(d => d.short).join(', ') + ') ต่อที่ขา VIN ของบอร์ด — ขานี้ให้ 5V เมื่อเสียบสาย USB' });
  if (devices.some(d => d.short === 'มอเตอร์' || d.short === 'เซอร์โว' || d.short === 'รีเลย์'))
    warnings.push({ level: 'info', text: 'มอเตอร์ / เซอร์โว / ปั๊ม กินกระแสสูง ควรใช้แหล่งไฟแยก ไม่ดึงจากบอร์ด ESP32 โดยตรง และต้องต่อ GND ร่วมกับบอร์ดเสมอ' });
  if (devices.some(d => d.shared === 'i2c'))
    warnings.push({ level: 'info', text: 'อุปกรณ์ I2C ทุกตัวต่อพ่วงบนสาย SDA/SCL ชุดเดียวกันได้ — ใช้ตัวอย่าง "ค้นหาอุปกรณ์ I2C" เช็กว่าบอร์ดเห็นครบทุกตัว' });

  const parts = [...new Set(devices.flatMap(d => d.parts))];
  return { devices, onboard, usage, rails, warnings, parts, blocks: blocks.length };
}

// the analysis of a saved example (headless workspace; comment icons are not needed for this)
function analyzeState(state) {
  const hw = new Blockly.Workspace();
  try {
    const clean = JSON.parse(JSON.stringify(state), (k, v) => (k === 'icons' ? undefined : v));
    Blockly.serialization.workspaces.load(clean, hw);
    return analyzeBlocks(hw.getAllBlocks(false));
  } finally { hw.dispose(); }
}

// ================================================================== UX part 2: board drawing
const xmlEsc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const trunc = (s, n) => (s.length > n ? s.slice(0, n - 1) + '…' : s);
const shortWire = p => p.split(/[ (/]/)[0];

// mode 'use': highlight the pins the program uses, with what is attached; 'ref': colour by usability
function boardSvg(an, mode) {
  const ref = mode === 'ref';
  const x0 = 176, x1 = 344, y0 = 56, dy = 26, W = 620, H = 500;      // board drawn at x 176-344, shifted 50 to the right (room for labels)
  let s = '<svg class="boardsvg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="แผนผังขา ' + BOARD30.name + '"><g transform="translate(50 0)">';
  s += '<rect class="pcb" x="' + x0 + '" y="20" width="' + (x1 - x0) + '" height="450" rx="18"/>';
  s += '<rect class="mod" x="206" y="36" width="108" height="100" rx="6"/><text class="modt" x="260" y="92">ESP32</text>';
  s += '<path class="ant" d="M214 152h14v-9h14v9h14v-9h14v9h14v-9h14v9h8"/>';
  s += '<circle class="btn" cx="208" cy="446" r="8"/><text class="btnt" x="208" y="466">EN</text>';
  s += '<circle class="btn" cx="312" cy="446" r="8"/><text class="btnt" x="312" y="466">BOOT</text>';
  s += '<rect class="usb" x="236" y="462" width="48" height="30" rx="4"/><text class="usbt" x="260" y="481">USB</text>';

  const style = id => {
    if (typeof id === 'number') {
      if (ref) { const i = PIN_INFO[id]; return { fill: ROLE_COLOR[i ? i.role : 'power'], note: i ? i.note : '', noteColor: i && i.role === 'bad' ? '#dc2626' : i && i.role === 'warn' ? '#b45309' : '#64748b' }; }
      const list = an ? an.usage.get(id) : null;
      if (!list) return { fill: '#334155', note: '' };
      const ds = [], seen = new Set();
      for (const u of list) if (!seen.has(u.dev)) { seen.add(u.dev); ds.push(u); }
      const clash = ds.length > 1 && !ds.every(u => u.dev.shared === 'i2c');
      const role = list[0].w.role;
      let label = ds.map(u => u.dev.short).join(' + ');
      if (role === 'sda' || role === 'scl') label = role.toUpperCase() + ' · ' + label;
      else if (ds.length === 1) label = label + ' · ' + shortWire(ds[0].w.pin);
      return { fill: clash ? '#ef4444' : wireColor(list[0].w, list[0].dev), note: (clash ? '⚠ ' : '') + label, used: true, clash, noteColor: '#172033' };
    }
    const rail = id === '3v3' ? '3V3' : id === '5v' ? '5V' : id === 'gnd' ? 'GND' : null;
    if (!rail) return { fill: '#94a3b8', note: ref ? 'รีเซ็ตบอร์ด' : '', noteColor: '#64748b' };
    if (ref) return { fill: '#94a3b8', note: rail === 'GND' ? 'กราวด์ (ขั้วลบ)' : rail === '5V' ? 'ไฟ 5V (จาก USB)' : 'ไฟ 3.3V', noteColor: '#64748b' };
    if (rail === 'GND') return an && an.devices.length ? { fill: RAILS.GND.color, note: 'GND (ต่อร่วมกัน)', used: true, noteColor: '#172033' } : { fill: '#334155', note: '' };
    const ds = an ? an.rails.get(rail) : null;
    return ds ? { fill: RAILS[rail].color, note: RAILS[rail].text + ' · ' + ds.map(d => d.short).join(' + '), used: true, noteColor: '#172033' } : { fill: '#334155', note: '' };
  };
  const side = (sd, list) => list.forEach(([lab, id], i) => {
    const x = sd === 'L' ? x0 : x1, y = y0 + i * dy, st = style(id);
    const sign = sd === 'L' ? -1 : 1;
    if (st.note) {
      const lx = x + sign * 26, tx = sd === 'L' ? 150 : 374;
      s += '<line x1="' + (x + sign * 9) + '" y1="' + y + '" x2="' + lx + '" y2="' + y + '" stroke="' + (ref ? '#cbd5e1' : st.fill) + '" stroke-width="' + (st.used ? 3 : 1.5) + '"/>';
      s += '<text class="pl' + (st.clash ? ' clash' : '') + '" x="' + (sd === 'L' ? 146 : 378) + '" y="' + (y + 4.5) + '" text-anchor="' + (sd === 'L' ? 'end' : 'start') + '"' +
           (ref ? ' style="fill:' + st.noteColor + ';font-weight:500;font-size:11.5px"' : '') + '>' + xmlEsc(trunc(st.note, ref ? 30 : 26)) + '</text>';
    }
    s += '<circle cx="' + x + '" cy="' + y + '" r="' + (st.used ? 9 : 7.5) + '" fill="' + st.fill + '" stroke="' + (st.clash ? '#fecaca' : '#e2e8f0') + '" stroke-width="' + (st.used ? 2.5 : 1) + '"/>';
    const g = typeof id === 'number' && silk(id) !== 'D' + id ? lab + ' · ' + id : lab;
    s += '<text class="pn" x="' + (x + sign * -17) + '" y="' + (y + 4) + '" text-anchor="' + (sd === 'L' ? 'start' : 'end') + '">' + xmlEsc(g) + '</text>';
  });
  side('L', BOARD30.left); side('R', BOARD30.right);
  return s + '</g></svg>';
}

}

        el('b', { className: 'ex-t', textContent: title }),
        m.about ? el('div', { className: 'ex-d', textContent: m.about }) : null,
        el('div', { className: 'ex-parts' }, ...(an.devices.length ? an.devices.slice(0, 4).map(d => el('span', { className: 'pchip', textContent: d.icon + ' ' + d.short })) : [el('span', { className: 'pchip ok', textContent: '✅ ไม่ต้องต่ออะไร' })]),
          an.devices.length > 4 ? el('span', { className: 'pchip', textContent: '+' + (an.devices.length - 4) }) : null));
      grid.append(card);
    });
    count.textContent = 'พบ ' + n + ' จาก ' + EXAMPLES.length + ' ตัวอย่าง';
    if (!n) grid.append(emptyCard('🔍', 'ไม่พบตัวอย่าง', 'ลองคำค้นอื่น หรือกดปุ่ม "ทั้งหมด"'));
  };
  for (const [k, t] of FILTERS) chips.append(el('button', { className: 'chip' + (k === 'all' ? ' on' : ''), textContent: t, onclick: e => {
    filter = k; for (const c of chips.children) c.classList.toggle('on', c === e.currentTarget); render(); } }));
  search.addEventListener('input', () => { query = search.value.trim().toLowerCase(); render(); });
  render();
  dlg.classList.add('wide');
  await dialog('📚 ตัวอย่างโปรแกรม', [search, chips, count, grid], [['ปิด', null]]);
  dlg.classList.remove('wide');
  if (picked !== null) loadExample(picked);
}

async function loadExample(i) {
  if (!ws || !await okToReplace('โหลดตัวอย่าง "' + EXAMPLES[i][0] + '"')) return;
  applyProgram({ name: '', blocks: EXAMPLES[i][1], manual: null });
  lastExample = { title: EXAMPLES[i][0], state: EXAMPLES[i][1] };
  addLine(2, '📘 ' + EXAMPLES[i][0]);
  const m = metaOf(i);
  if (m.an.devices.length) { addLine(2, '   ต้องต่ออุปกรณ์ ' + m.an.devices.length + ' อย่าง — ดูวิธีต่อสายที่แท็บ "การต่อสาย"'); setTimeout(() => { refreshWiring(); showRight('wiring'); }, 120); }
  else { for (const n of exampleNotes(EXAMPLES[i][1])) for (const l of n.split('\n')) addLine(2, '   ' + l); setTimeout(() => { refreshWiring(); showRight('console'); }, 120); }
}
$('galleryBtn').onclick = openGallery;

// ------------------------------------------------------------------ welcome
async function welcome() {
  const step = (n, t, d) => el('div', { className: 'wstep' }, el('span', { className: 'wn', textContent: String(n) }), el('div', null, el('b', { textContent: t }), el('div', { className: 'muted', textContent: d })));
  const body = [el('p', { className: 'wlead', textContent: 'เขียนโปรแกรมควบคุมบอร์ด ESP32 ด้วยการลากบล็อก — แล้วกดรันได้ทันที ไม่ต้องคอมไพล์ ไม่ต้องแฟลชใหม่' }),
    step(1, 'ลากบล็อก', 'เลือกหมวดสีทางซ้าย ลากบล็อกมาต่อกัน (หรือกด 🔍 ค้นหาบล็อก)'),
    step(2, 'กด ▶ รัน', 'โปรแกรมทำงานบนบอร์ดทันที กด ■ หยุด เมื่ออยากหยุด'),
    step(3, 'ดูผลและวิธีต่อสาย', 'คอนโซลแสดงข้อความ ส่วนแท็บ "🔌 การต่อสาย" บอกว่าอุปกรณ์แต่ละตัวต้องต่อขาไหน'),
    el('p', { className: 'muted', textContent: 'เริ่มง่ายที่สุด: เลือกตัวอย่าง "ไฟกะพริบ" ไม่ต้องต่ออะไรเพิ่ม ไฟสีฟ้าบนบอร์ดจะกะพริบ' })];
  const v = await dialog('👋 ยินดีต้อนรับสู่ ESP32 Live Code', body, [['ข้ามไปก่อน', null], ['📚 ดูตัวอย่างทั้งหมด', 'gallery'], ['▶ ลองไฟกะพริบ', 'try', 'primary']]);
  store.set('lc_seen', '1');
  if (v === 'try') { await loadExample(0); showRight('console'); setTimeout(run, 400); }
  else if (v === 'gallery') openGallery();
}

// ------------------------------------------------------------------ block search (Ctrl+K)
let blockIndex = null;
function buildBlockIndex() {
  const hw = new Blockly.Workspace(), out = [];
  for (const c of TOOLBOX.contents) if (c.contents) for (const it of c.contents) if (it.kind === 'block') {
    try {
      const st = { type: it.type, inputs: it.inputs, fields: it.fields, extraState: it.extraState };
      const b = Blockly.serialization.blocks.append(st, hw);
      out.push({ cat: c.name, color: c.colour, st, text: b.toString().replace(/\?/g, '…'), tip: String(b.getTooltip ? b.getTooltip() : '').split('\n')[0] });
    } catch (e) { /* block not available in the headless workspace */ }
  }
  hw.dispose();
  return out;
}
async function openBlockSearch() {
  if (!ws) return;
  blockIndex = blockIndex || buildBlockIndex();
  let picked = null, q = '';
  const list = el('div', { className: 'bs-list' });
  const input = el('input', { type: 'text', className: 'gal-search', placeholder: '🔍 พิมพ์ชื่อบล็อก เช่น dht, servo, delay, แก๊ส', autocomplete: 'off' });
  const render = () => {
    list.replaceChildren();
    const hits = blockIndex.filter(b => !q || (b.text + ' ' + b.tip + ' ' + b.cat).toLowerCase().includes(q)).slice(0, 40);
    for (const b of hits) list.append(el('button', { className: 'bs-row', onclick: () => { picked = b.st; dlg.querySelector('.df button').click(); } },
      el('i', { style: 'background:' + b.color }), el('span', { className: 'bs-t', textContent: b.text }), el('small', { textContent: b.cat.replace(/^\S+\s/, '') + (b.tip ? ' · ' + trunc(b.tip, 60) : '') })));
    if (!hits.length) list.append(el('div', { className: 'muted', textContent: 'ไม่พบบล็อก' }));
  };
  input.addEventListener('input', () => { q = input.value.trim().toLowerCase(); render(); });
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { const r = list.querySelector('.bs-row'); if (r) r.click(); } });
  render();
  await dialog('🔍 ค้นหาบล็อก', [input, list], [['ปิด', null]]);
  if (!picked) return;
  await showTab('blocks');
  Blockly.Events.setGroup(true);                         // create + move = one undo step
  try {
    const b = Blockly.serialization.blocks.append(picked, ws, { recordUndo: true });   // default is false: Undo would skip the creation
    try {
      const vm = ws.getMetricsManager().getViewMetrics(true), p = b.getRelativeToSurfaceXY();
      b.moveBy(vm.left + vm.width / 2 - 70 - p.x, vm.top + vm.height / 3 - p.y);
      Blockly.common.setSelected(b);
    } catch (e) { /* position is a nicety */ }
  } finally { Blockly.Events.setGroup(false); }
  toast('วางบล็อกแล้ว — ลากไปต่อกับบล็อกอื่นได้เลย');
}

// ------------------------------------------------------------------ tools next to the tabs
$('tbUndo').onclick = () => { if (ws) ws.undo(false); };
$('tbRedo').onclick = () => { if (ws) ws.undo(true); };
$('tbFit').onclick = () => {
  if (!ws) return;
  try {
    const bb = ws.getBlocksBoundingBox(), vm = ws.getMetricsManager().getViewMetrics(false);
    const k = Math.min(vm.width / (bb.right - bb.left + 100), vm.height / (bb.bottom - bb.top + 100), 1);
    ws.setScale(Math.max(0.3, Math.min(1, k)));
  } catch (e) { /* keep current zoom */ }
  ws.scrollCenter();
};
$('tbSearch').onclick = openBlockSearch;
$('tbPins').onclick = showPinout;
ACTIONS.help = welcome;
ACTIONS.pins = showPinout;
document.addEventListener('keydown', e => { if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); openBlockSearch(); } });

refreshWiring();
if (!store.get('lc_seen')) setTimeout(welcome, 600);

// ------------------------------------------------------------------ polling
let since = 0, vs = -1, lastClear = 0, fails = 0, lastVals = null, bootId = null;
const statusEl = $('status');
function setStatus(cls, text) { statusEl.className = cls; statusEl.textContent = text; }
async function poll() {
  try {
    // time out: a request cut off by a reboot or WiFi drop must not stall polling forever
    const ac = new AbortController(), to = setTimeout(() => ac.abort(), 3000);
    let j;
    try {
      const r = await fetch('/api/log?since=' + since + '&vs=' + vs, { cache: 'no-store', signal: ac.signal });
      j = await r.json();
    } finally { clearTimeout(to); }
    fails = 0;
    if (bootId !== null && j.boot !== bootId) {                              // board restarted
      bootId = j.boot; since = 0; vs = -1; lastClear = 0;
      addLine(2, '— บอร์ดเริ่มทำงานใหม่ —');
      refreshInfo();
      setTimeout(poll, 0);
      return;
    }
    bootId = j.boot;
    if (j.clear > lastClear) { con.textContent = ''; lastClear = j.clear; } // clear() on the board
    for (const l of j.lines) { addLine(l.t, l.m); since = l.s; }
    if (j.vals) lastVals = j.vals;
    if (lastVals && (j.vals || j.running)) renderVals(lastVals);            // keep graphs moving while running
    vs = j.vs;
    setStatus(j.running ? 'run' : '', j.running ? 'กำลังทำงาน' : 'ว่าง');
  } catch (e) {
    if (++fails >= 3) setStatus('off', 'ขาดการเชื่อมต่อ');
  }
  setTimeout(poll, 250);
}
function refreshInfo() {
  return fetch('/api/info', { cache: 'no-store' }).then(r => r.json()).then(i => {
    boardInfo = i;
    $('info').textContent = i.ip + ' · ' + (i.mode === 'ap' ? 'โหมด AP' : i.ssid) + ' · v' + i.ver;
    $('auto').style.display = i.autorun ? 'inline' : 'none';
  }).catch(() => {});
}
refreshInfo();
updateManual();
setDirty(dirty);
poll();
